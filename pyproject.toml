[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reviveguard"
version = "0.1.0.dev0"
description = "Linux security auditing and controlled auto-remediation tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
reviveguard = "reviveguard.cli:main"

[tool.setuptools.packages.find]
include = ["reviveguard*"]

[tool.setuptools.package-data]
"reviveguard.i18n" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
